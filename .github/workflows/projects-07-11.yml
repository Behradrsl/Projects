name: Projects 07-11 checks

on:
  push:
    paths:
      - "07-contact-book/**"
      - "08-tic-tac-toe/**"
      - "09-sorting-algorithms/**"
      - "10-youtube-downloader/**"
      - "11-currency-converter/**"
      - ".github/workflows/projects-07-11.yml"
  pull_request:
    paths:
      - "07-contact-book/**"
      - "08-tic-tac-toe/**"
      - "09-sorting-algorithms/**"
      - "10-youtube-downloader/**"
      - "11-currency-converter/**"
      - ".github/workflows/projects-07-11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [07-contact-book, 08-tic-tac-toe, 09-sorting-algorithms, 10-youtube-downloader, 11-currency-converter]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
