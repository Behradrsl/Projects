name: Agentic MBSE Loop checks

on:
  push:
    paths:
      - "25-agentic-mbse-loop/**"
      - ".github/workflows/agentic-mbse-loop.yml"
  pull_request:
    paths:
      - "25-agentic-mbse-loop/**"
      - ".github/workflows/agentic-mbse-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 25-agentic-mbse-loop

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
