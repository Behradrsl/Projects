name: Projects 12-21 checks

on:
  push:
    paths:
      - "12-number-to-words/**"
      - "13-daily-quote-emailer/**"
      - "14-image-conversion/**"
      - "15-site-connectivity-checker/**"
      - "16-wordle/**"
      - "17-name-statistics-explorer/**"
      - "18-web-scraper/**"
      - "19-fake-news-detection/**"
      - "20-resume-auto-review/**"
      - "21-faq-telegram-bot/**"
      - ".github/workflows/projects-12-21.yml"
  pull_request:
    paths:
      - "12-number-to-words/**"
      - "13-daily-quote-emailer/**"
      - "14-image-conversion/**"
      - "15-site-connectivity-checker/**"
      - "16-wordle/**"
      - "17-name-statistics-explorer/**"
      - "18-web-scraper/**"
      - "19-fake-news-detection/**"
      - "20-resume-auto-review/**"
      - "21-faq-telegram-bot/**"
      - ".github/workflows/projects-12-21.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - 12-number-to-words
          - 13-daily-quote-emailer
          - 14-image-conversion
          - 15-site-connectivity-checker
          - 16-wordle
          - 17-name-statistics-explorer
          - 18-web-scraper
          - 19-fake-news-detection
          - 20-resume-auto-review
          - 21-faq-telegram-bot
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
