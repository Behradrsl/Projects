name: Projects 22-24 checks

on:
  push:
    paths:
      - "22-drone-altitude-control/**"
      - "23-drone-mission-trade-study/**"
      - "24-mbse-traceability-explorer/**"
      - ".github/workflows/projects-22-24.yml"
  pull_request:
    paths:
      - "22-drone-altitude-control/**"
      - "23-drone-mission-trade-study/**"
      - "24-mbse-traceability-explorer/**"
      - ".github/workflows/projects-22-24.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - 22-drone-altitude-control
          - 23-drone-mission-trade-study
          - 24-mbse-traceability-explorer
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
