name: LOOP-MBSE checks

on:
  push:
    paths:
      - "25-loop-mbse/**"
      - ".github/workflows/loop-mbse.yml"
  pull_request:
    paths:
      - "25-loop-mbse/**"
      - ".github/workflows/loop-mbse.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 25-loop-mbse

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
