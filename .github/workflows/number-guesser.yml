name: Number Guesser checks

on:
  push:
    paths:
      - "01-number-guesser-game/**"
      - ".github/workflows/number-guesser.yml"
  pull_request:
    paths:
      - "01-number-guesser-game/**"
      - ".github/workflows/number-guesser.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: 01-number-guesser-game

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: number-guesser --version
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.11.13
      - run: ruff check .
      - run: ruff format --check .
