[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rps-studio"
version = "1.0.0"
description = "A browser-based Rock Paper Scissors game with a Python engine and SQLite history."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask>=3.1,<4"]

[project.optional-dependencies]
dev = ["ruff==0.11.13", "playwright>=1.51,<2"]

[project.scripts]
rps = "rock_paper_scissors.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rock_paper_scissors = ["static/*", "templates/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
